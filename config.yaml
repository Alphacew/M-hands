# M-Hands Production Configuration

gestures:
  classes:
    - "Open_Palm"
    - "Closed_Fist"
    - "Index_Point"
    - "Victory"
  labels:
    0: "Open_Palm"
    1: "Closed_Fist"
    2: "Index_Point"
    3: "Victory"

mediapipe:
  max_num_hands: 1
  min_detection_confidence: 0.70
  min_tracking_confidence: 0.60
  model_complexity: 1

preprocessing:
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: [8, 8]
  bilateral_reflection: true

filter:
  standard:
    min_cutoff: 1.0
    beta: 0.007
    d_cutoff: 1.0
  tremor_suppression:
    min_cutoff: 0.4
    beta: 0.002
    d_cutoff: 1.0

state_machine:
  engage_threshold: 0.85
  release_threshold: 0.40
  dwell_time_ms: 250
  release_timeout_ms: 150

slider:
  min_val: 0.0
  max_val: 100.0
  roi_x_min: 0.15
  roi_x_max: 0.85

camera:
  device_id: 0
  frame_width: 1280
  frame_height: 720
  target_fps: 60
