[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mhands"
version = "0.1.0"
description = "Production-grade Real-Time Hand Gesture Recognition with Geometrically Invariant Representations"
authors = [{ name = "Senior CV Engineer" }]
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "mediapipe==0.10.14",
    "opencv-python==4.9.0.80",
    "scikit-learn==1.4.2",
    "numpy==1.26.4",
    "joblib==1.4.0",
    "pyyaml==6.0.1",
    "matplotlib==3.8.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mhands*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
